<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Чат с собой (пока)</title>
    </head>
    <body>
        <h1>WebSocket Chat</h1>
        <div id="messages"></div>
        <textarea id="message" placeholder="Введите сообщение"></textarea>
        <button id="send">Отправить</button>

<!--        <form action="" onsubmit="sendMessage(event)">-->
<!--            <input type="text" id="messageText" autocomplete="off"/>-->
<!--            <button>Send</button>-->
<!--        </form>-->

<!--        <ul id='messages'></ul>-->

        <script>
            const accessToken = sessionStorage.getItem('accessToken');

            if (!accessToken) {
                alert('Необходимо авторизоваться');
                window.location.href = 'login.html'; // Перенаправление на страницу логина
            }

            // Передаем токен в URL-строке при подключении
            const socket = new WebSocket(`ws://127.0.0.1:8000/ws/chat?token=${accessToken}`);

            socket.onopen = () => {
                console.log("Подключено к WebSocket!");
                socket.send("Привет, я в сети!"); // Сообщение можно отправить после подключения
            };

            socket.onmessage = (event) => {
                const messagesDiv = document.getElementById('messages');
                const newMessage = document.createElement('div');
                newMessage.textContent = event.data;
                messagesDiv.appendChild(newMessage);
            };

            socket.onerror = (error) => {
                console.error("Ошибка WebSocket:", error);
            };

            socket.onclose = () => {
                console.log("Соединение закрыто");
            };

            document.getElementById('send').addEventListener('click', function () {
                const message = document.getElementById('message').value;
                socket.send(message); // Отправляем сообщение
                document.getElementById('message').value = ''; // Очищаем поле ввода
            });
</script>

    </body>
</html>
