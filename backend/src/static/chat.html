<!DOCTYPE html>
<html>
    <head>
        <title>WebSocket Chat</title>
    </head>
    <body>
        <h1>WebSocket Chat</h1>
        <h2>Your ID: <span id="ws-id"></span></h2>
        <h2>Your Token: <span id="ws-token"></span></h2>

        <form action="" onsubmit="sendMessage(event)">
            <input type="text" id="messageText" autocomplete="off"/>
            <button>Send</button>
        </form>

        <ul id='messages'></ul>

        <script>
            let client_id;
            let token;
            let ws;

            async function getAuthData() {
                try {
                    // Получаем токен из localStorage
                    const token = localStorage.getItem('access_token');
                    if (!token) {
                        alert('Токен не найден! Пожалуйста, авторизуйтесь.');
                        return;
                    }

                    const response = await fetch('/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (!response.ok) {
                        throw new Error('Ошибка получения данных пользователя');
                    }

                    const data = await response.json();
                    console.log('User data:', data);

                    client_id = data.detail.id;

                    document.querySelector("#ws-id").textContent = client_id;
                    document.querySelector("#ws-token").textContent = token;

                    connectWebSocket();
                } catch (error) {
                    alert('Ошибка получения данных аутентификации: ' + error.message);
                }
            }

            function connectWebSocket() {
                ws = new WebSocket(`ws://localhost:8000/ws/${client_id}`, ["Bearer " + token]);

                ws.onopen = () => {
                    console.log("WebSocket connected successfully!");
<!--                    ws.send(JSON.stringify({ token: token }));-->
                };

                ws.onmessage = (event) => {
                    const messages = document.getElementById('messages');
                    const message = document.createElement('li');
                    message.textContent = event.data;
                    messages.appendChild(message);
                };

                ws.onerror = (error) => {
                    console.error("WebSocket Error:", error);
                };

                ws.onclose = () => {
                    console.warn("WebSocket closed. Trying to reconnect...");
                    setTimeout(connectWebSocket, 3000);
                };
            }

            function sendMessage(event) {
                const input = document.getElementById("messageText");

                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(input.value);
                } else {
                    alert("Соединение закрыто, переподключитесь!");
                }

                input.value = '';
                event.preventDefault();
            }

            window.onload = getAuthData;
