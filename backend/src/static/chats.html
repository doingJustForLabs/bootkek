<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чаты</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .chat-list {
            margin-top: 20px;
        }
        .chat-item {
            border: 1px solid #ddd;
            margin: 10px 0;
            padding: 10px;
        }
        .message-list {
            list-style-type: none;
            padding: 0;
        }
        .message-item {
            padding: 5px;
            margin-bottom: 5px;
            border: 1px solid #ddd;
        }
        .message-form input {
            padding: 5px;
            width: 80%;
        }
        .message-form button {
            padding: 5px 10px;
        }
    </style>
</head>
<body>

<h1>Чаты</h1>

<div>
    <h2>Создать новый чат</h2>
    <form id="createChatForm">
        <label for="chatName">Название чата:</label><br>
        <input type="text" id="chatName" name="chatName" required><br><br>

        <label for="users">Выберите пользователей:</label><br>
        <select id="users" name="users" multiple size="5"></select><br><br>

        <button type="submit">Создать чат</button>
    </form>
</div>

<div class="chat-list">
    <h2>Ваши чаты</h2>
    <ul id="chatList"></ul>
</div>

<div id="messagesContainer" style="display:none;">
    <h2>Сообщения чата <span id="chatNameSpan"></span></h2>
    <ul id="messageList" class="message-list"></ul>
    <div class="message-form">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." />
        <button id="sendMessageButton">Отправить</button>
    </div>
</div>

<script>
    const chatListElement = document.getElementById('chatList');
    const usersSelectElement = document.getElementById('users');
    const createChatForm = document.getElementById('createChatForm');
    const messageListElement = document.getElementById('messageList');
    const messagesContainer = document.getElementById('messagesContainer');
    const chatNameSpan = document.getElementById('chatNameSpan');
    const messageInput = document.getElementById('messageInput');
    const sendMessageButton = document.getElementById('sendMessageButton');
    let currentChatId = null;
    let websocket = null;
    let userId = null;

    async function getUserId() {
        const token = sessionStorage.getItem('accessToken');  // Получаем токен из sessionStorage
        console.log("Token: ", token);
        const response = await fetch('/api/auth/me', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`, // Токен передается в заголовке
                'Content-Type': 'application/json'
            }
        });

        const data = await response.json();
        console.log("Response data:", data);

        if (response.ok && data && data.detail && data.detail.id) {
            return data.detail.id;
        } else {
            console.log('Ошибка авторизации');
            return null;
        }
<!--        return userId;-->
    }

    // Загружаем список пользователей при загрузке страницы
    async function loadUsers() {
        const response = await fetch('/api/users');
        const users = await response.json();

        users.forEach(user => {
            const option = document.createElement('option');
            option.value = user.id;
            option.textContent = user.email;
            usersSelectElement.appendChild(option);
        });
    }

    // Загружаем чаты для текущего пользователя
    async function loadChats() {
        const userId = await getUserId();
        const response = await fetch(`/api/chats/${userId}`);
        const chats = await response.json();

        chatListElement.innerHTML = ''; // Очистка списка чатов
        chats.forEach(chat => {
            const chatItem = document.createElement('li');
            chatItem.classList.add('chat-item');
            chatItem.textContent = chat.name;
            chatItem.addEventListener('click', () => openChat(chat.id, chat.name));
            chatListElement.appendChild(chatItem);
        });
    }

    // Открытие чата
    function openChat(chatId, chatName) {
        currentChatId = chatId;
        chatNameSpan.textContent = chatName;
        messagesContainer.style.display = 'block';
        loadMessages();
        initializeWebSocket(chatId);
    }

    // Загружаем сообщения для выбранного чата
    async function loadMessages() {
        const response = await fetch(`/api/chats/${currentChatId}/messages`);
        const messages = await response.json();

        messageListElement.innerHTML = ''; // Очистка списка сообщений
        messages.forEach(message => {
            const messageItem = document.createElement('li');
            messageItem.classList.add('message-item');
            messageItem.textContent = `${message.username}: ${message.content}`;
            messageListElement.appendChild(messageItem);
        });
    }

    // Отправка сообщения в чат
    sendMessageButton.addEventListener('click', () => {
        const content = messageInput.value.trim();
<!--        if (content) {-->
<!--            websocket.send(JSON.stringify({-->
<!--                content: content-->
<!--            }));-->
<!--            messageInput.value = ''; // Clear the input field-->
<!--        }-->
        websocket.send(content);
    });

    // Инициализация WebSocket для общения в чате
    function initializeWebSocket(chatId) {
        if (websocket && websocket.readyState === WebSocket.OPEN) {
            console.log("WebSocket уже открыт.");
            return;  // Don't open a new WebSocket if it's already open
        }

        websocket = new WebSocket('ws://127.0.0.1:8000/ws/chat');
        const accessToken = sessionStorage.getItem('accessToken');

        // Проверка наличия токена
        if (!accessToken) {
            alert('Необходимо авторизоваться');
            window.location.href = '/'; // Перенаправление на страницу логина
        }

        websocket.onopen = () => {
            console.log("Подключено к WebSocket!");
            chatId = parseInt(chatId);
            websocket.send(JSON.stringify({ token: accessToken, chatId: chatId })); // Отправка токена и ID чата при подключении
        };

        websocket.onmessage = (event) => {
            try {
                const message = JSON.parse(event.data);
                if (message.type === "user_message") {
                    const messageItem = document.createElement('li');
                    messageItem.classList.add('message-item');
                    messageItem.textContent = `${message.username}: ${message.content}`;
                    messageListElement.appendChild(messageItem);
                }
            } catch (error) {
                console.error("Error parsing WebSocket message:", error);
            }
        };

        websocket.onerror = (error) => {
            console.log("WebSocket error:", error);
        };

        websocket.onclose = () => {
            console.log("WebSocket connection closed");
        };
    }

    // Создание чата через форму
    createChatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('chatName').value;
        const userIds = Array.from(usersSelectElement.selectedOptions).map(option => parseInt(option.value));
        userIds.push(parseInt(userId));

        const body = { name, user_ids: userIds };
        console.log(body); // Выведите данные перед отправкой
        const response = await fetch('/api/chats', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        const result = await response.json();
        alert(result.message); // Выводим сообщение о результате
        loadChats();  // Обновляем список чатов
    });

    // Инициализация
<!--    getUserId();-->
    loadUsers();
    loadChats(getUserId());
</script>

</body>
</html>
