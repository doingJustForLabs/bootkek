<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чаты</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: space-between;
        }
        #chat-list {
            width: 200px;
            border-right: 1px solid #ccc;
            padding: 10px;
        }
        #chat-list ul {
            list-style-type: none;
            padding: 0;
        }
        #chat-list li {
            cursor: pointer;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #chat-list li:hover {
            background-color: #f0f0f0;
        }
        #messages {
            width: 60%;
            max-height: 400px;
            overflow-y: auto;
            margin: 10px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        textarea {
            width: 100%;
            height: 60px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="chat-list">
        <h3>Чаты</h3>
        <ul id="chat-names"></ul>
        <button id="create-chat">Создать чат</button>
    </div>

    <div id="chat-container">
        <h1>Выберите чат</h1>
        <div id="messages"></div>
        <textarea id="message" placeholder="Введите сообщение"></textarea>
        <button id="send">Отправить</button>
    </div>

    <script>
        const websocket = new WebSocket('ws://127.0.0.1:8000/ws/chat');
        let activeChatId = null;
        const accessToken = sessionStorage.getItem('accessToken');

        // Проверяем наличие токена
        if (!accessToken) {
            alert('Необходимо авторизоваться');
            window.location.href = '/'; // Перенаправление на страницу логина
        }

        websocket.onopen = () => {
            console.log("Подключено к WebSocket!");
            websocket.send(JSON.stringify({ token: accessToken })); // Отправка токена при подключении
        };

        websocket.onmessage = (event) => {
            const messageData = JSON.parse(event.data); // Парсим JSON-ответ от сервера

            // Если сообщение пришло для активного чата
            if (messageData.chatId === activeChatId) {
                const messagesDiv = document.getElementById('messages');
                const newMessage = document.createElement('div');
                newMessage.textContent = `${messageData.username}: ${messageData.content}`;
                messagesDiv.appendChild(newMessage);
                messagesDiv.scrollTop = messagesDiv.scrollHeight; // Автопрокрутка
            }
        };

        websocket.onerror = (error) => {
            console.error("Ошибка WebSocket:", error);
            alert('Ошибка WebSocket: ' + error.message);
        };

        websocket.onclose = () => {
            console.log("Соединение закрыто");
            alert('WebSocket соединение закрыто');
        };

        document.getElementById('send').addEventListener('click', function () {
            const message = document.getElementById('message').value.trim();
            if (message && activeChatId) {
                // Отправляем сообщение только в активный чат
                websocket.send(JSON.stringify({
                    chatId: activeChatId,
                    content: message
                }));
                document.getElementById('message').value = ''; // Очищаем поле ввода
            }
        });

        document.getElementById('create-chat').addEventListener('click', () => {
            const chatName = prompt('Введите название нового чата:');
            if (chatName) {
                // Создание нового чата через API
                fetch('/api/create-chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name: chatName })
                }).then(response => response.json())
                .then(data => {
                    // Добавление нового чата в список
                    addChatToList(data.chatId, chatName);
                }).catch(error => {
                    console.error("Ошибка создания чата:", error);
                });
            }
        });

        function addChatToList(chatId, chatName) {
            const chatList = document.getElementById('chat-names');
            const chatItem = document.createElement('li');
            chatItem.textContent = chatName;
            chatItem.onclick = () => switchChat(chatId, chatName);
            chatList.appendChild(chatItem);
        }

        function switchChat(chatId, chatName) {
            // Переключение на другой чат
            activeChatId = chatId;
            document.getElementById('messages').innerHTML = ''; // Очищаем старые сообщения
            document.querySelector('#chat-container h1').textContent = `Чат: ${chatName}`;
        }
    </script>
</body>
</html>
