<!DOCTYPE html>
<html>
    <head>
        <title>WebSocket Chat</title>
    </head>
    <body>
        <h1>WebSocket Chat</h1>
        <h2>Your ID: <span id="ws-id"></span></h2>
        <form action="" onsubmit="sendMessage(event)">
            <input type="text" id="messageText" autocomplete="off"/>
            <button>Send</button>
        </form>
        <ul id='messages'>
        </ul>
        <script>
            var client_id = Math.floor(Math.random() * 9000) + 1000;
            document.querySelector("#ws-id").textContent = client_id;
             // Автоматическая генерация случайного токена
            var token = Math.random().toString(36).substring(7);

            var ws = new WebSocket(`ws://localhost:8000/ws/${client_id}?token=${token}`);

            ws.onopen = function () {
                console.log("WebSocket connected successfully!");
            };

            ws.onmessage = function(event) {
                var messages = document.getElementById('messages')
                var message = document.createElement('li')
                var content = document.createTextNode(event.data)
                message.appendChild(content)
                messages.appendChild(message)
            };

            // Обработчик ошибок WebSocket
            ws.onerror = function (error) {
                console.error("WebSocket Error:", error);
            };

            // Закрытие соединения
            ws.onclose = function () {
                console.warn("WebSocket closed. Trying to reconnect...");
                setTimeout(() => location.reload(), 3000); // Перезагрузка через 3 сек
            };

            function sendMessage(event) {
                var input = document.getElementById("messageText")

                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(input.value);
                } else {
                    alert("Соединение закрыто, переподключитесь!");
                }

                input.value = ''
                event.preventDefault()
            }
        </script>
    </body>
</html>
