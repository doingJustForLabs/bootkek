user root;
worker_processes  1;

events {
    worker_connections 1024;
}

http {
    gzip on;
    gzip_types application/javascript;
    gzip_comp_level 6;

    server {
        listen       80;
        server_name  localhost;

        location / {
            proxy_pass http://frontend:5173/;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
        }
    }
}