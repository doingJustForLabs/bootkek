services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: granite_backend
    ports:
      - "8000:8000"
    environment:
      - DB__URL=postgresql+asyncpg://user:password@db:5432/granite
    env_file: ./backend/src/.env
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    container_name: granite_db
    environment:
      POSTGRES_DB: granite
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user" ]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
